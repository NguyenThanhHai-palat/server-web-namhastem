<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thêm chủ đề — CLB Khám phá Công nghệ</title>
<style>
  :root{--primary:#1d4ed8;--primary-dark:#1e3a8a;--bg:#f4f6fb;--card:#fff;--border:#e2e8f0;--text:#1f2937;--muted:#6b7280;--ok:#16a34a;--danger:#dc2626;}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:1.4rem;color:var(--primary-dark);margin-bottom:4px;}
  .sub{color:var(--muted);margin-bottom:20px;font-size:.9rem;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 6px;color:#374151;}
  input,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;}
  textarea{min-height:80px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  button{margin-top:18px;background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:.95rem;cursor:pointer;font-weight:600;}
  button:hover{background:var(--primary-dark);}
  button:disabled{background:#9ca3af;cursor:not-allowed;}
  #msg{margin-top:12px;font-size:.9rem;padding:10px 12px;border-radius:8px;display:none;}
  #msg.ok{display:block;background:#ecfdf3;color:var(--ok);border:1px solid #bbf7d0;}
  #msg.err{display:block;background:#fef2f2;color:var(--danger);border:1px solid #fecaca;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Thêm chủ đề đào tạo</h1>
  <div class="sub">CLB Khám phá Công nghệ — Trường THPT Nam Hà</div>

  <div class="card">
    <label for="id_phan">Mã chủ đề (id_phan)</label>
    <input id="id_phan" placeholder="VD: 3">

    <label for="ten_chu_de">Tên chủ đề</label>
    <input id="ten_chu_de" placeholder="VD: Nhập môn cơ sở dữ liệu">

    <label for="noidung">Nội dung</label>
    <textarea id="noidung" placeholder="Mô tả nội dung chủ đề..."></textarea>

    <div class="row2">
      <div>
        <label for="thoigianbatdau">Thời gian bắt đầu</label>
        <input id="thoigianbatdau" type="date">
      </div>
      <div>
        <label for="thoigianketthuc">Thời gian kết thúc</label>
        <input id="thoigianketthuc" type="date">
      </div>
    </div>

    <label for="sotinchi">Số tín chỉ</label>
    <input id="sotinchi" type="number" min="0">

    <label for="yeucau">Yêu cầu</label>
    <textarea id="yeucau" placeholder="Yêu cầu để hoàn thành chủ đề..."></textarea>

    <label for="yeucauchudetruoc">Yêu cầu chủ đề trước (id_phan bắt buộc phải hoàn thành trước, để trống nếu không có)</label>
    <input id="yeucauchudetruoc" placeholder="VD: 2">

    <button id="submitBtn">Thêm chủ đề</button>
    <div id="msg"></div>
  </div>
</div>

<script>
const API_BASE = "https://namha-tech.io.vn"; // đổi nếu domain khác
const token = localStorage.getItem("token"); // đổi key nếu bạn lưu token chỗ khác

document.getElementById("submitBtn").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  msg.className = ""; msg.style.display = "none";

  const body = {
    id_phan: document.getElementById("id_phan").value.trim(),
    ten_chu_de: document.getElementById("ten_chu_de").value.trim(),
    noidung: document.getElementById("noidung").value.trim(),
    thoigianbatdau: document.getElementById("thoigianbatdau").value,
    thoigianketthuc: document.getElementById("thoigianketthuc").value,
    sotinchi: document.getElementById("sotinchi").value,
    yeucau: document.getElementById("yeucau").value.trim(),
    yeucauchudetruoc: document.getElementById("yeucauchudetruoc").value.trim(),
  };

  for (const k of ["id_phan","ten_chu_de","noidung","thoigianbatdau","thoigianketthuc","sotinchi","yeucau","yeucauchudetruoc"]) {
    if (!body[k]) {
      msg.textContent = "Vui lòng điền đầy đủ thông tin.";
      msg.className = "err";
      return;
    }
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Đang thêm...";
  try {
    const res = await fetch(`${API_BASE}/giaotrinh/add`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = "Đã thêm chủ đề thành công!";
      msg.className = "ok";
      document.querySelectorAll("input, textarea").forEach(el => el.value = "");
    } else {
      msg.textContent = data.message || "Có lỗi xảy ra.";
      msg.className = "err";
    }
  } catch (err) {
    msg.textContent = "Lỗi kết nối máy chủ.";
    msg.className = "err";
  } finally {
    btn.disabled = false; btn.textContent = "Thêm chủ đề";
  }
});
</script>
</body>
</html>
