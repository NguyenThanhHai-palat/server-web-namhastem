<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhập mã OTP — NamHà Tech Club</title>
<link rel="stylesheet" href="/assets/css/login-c.css" />
</head>
<body>

<div class="circuit-bg" aria-hidden="true">
  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#1a8296" stroke-width="1.4" fill="none" opacity="0.4">
      <path d="M0 80 H160 V40 H320"/>
      <path d="M800 420 H700 V380 H560 V440 H420"/>
      <path d="M40 520 H180 V480 H300 V560"/>
    </g>
    <g fill="#1a8296" opacity="0.55">
      <circle cx="160" cy="80" r="4"/><circle cx="320" cy="40" r="4"/>
      <circle cx="700" cy="420" r="4"/><circle cx="420" cy="440" r="4"/>
      <circle cx="180" cy="520" r="4"/><circle cx="300" cy="560" r="4"/>
    </g>
  </svg>
</div>

<div class="card">
  <div class="masthead">
     <img src="https://namha-tech.io.vn/assets/img/kaiadmin/logo_light.svg" alt="NamHà Tech Club" width="100%" style="display:block; border:0;">
  </div>

  <div class="body-area">
    <div class="step-track">
      <div class="step-dot done">&#10003;</div><div class="step-line"></div>
      <div class="step-dot active">2</div><div class="step-line"></div>
      <div class="step-dot pending">3</div>
    </div>

    <h1>Xác thực OTP</h1>
    <p class="desc">Nhập mã 6 số vừa được gửi đến</p>
    <p class="email-shown" id="emailShown">email của bạn</p>

    <form id="otpForm" novalidate>
      <div class="otp-row">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-index="0">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-index="1">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-index="2">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-index="3">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-index="4">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" data-index="5">
      </div>
      <div class="err-msg" id="errMsg"></div>
      <div class="timer" id="timerBox">Mã hết hạn sau <span id="countdown">05:00</span> &middot; <a id="resendLink" class="disabled">Gửi lại mã</a></div>
      <button type="submit" id="submitBtn">Xác nhận</button>
    </form>

    <a class="back-link" href="/resetpassword/">&larr; Đổi email khác</a>
  </div>
</div>

<script>
  const API_BASE = "https://namha-tech.io.vn"; // đổi nếu domain khác

  const emailShown = document.getElementById('emailShown');
  const storedEmail = sessionStorage.getItem('reset_email');
  const storedService = sessionStorage.getItem('reset_service');

  if (!storedEmail || !storedService) {
    window.location.href = '/resetpassword/';
  }
  if (storedEmail) {
    const [user, domain] = storedEmail.split('@');
    const masked = user.length > 2
      ? user.slice(0,2) + '***' + '@' + domain
      : user[0] + '***@' + domain;
    emailShown.textContent = masked;
  }

  const boxes = Array.from(document.querySelectorAll('.otp-box'));
  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/[^0-9]/g, '');
      if (box.value && i < boxes.length - 1) boxes[i+1].focus();
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && i > 0) boxes[i-1].focus();
    });
    box.addEventListener('paste', (e) => {
      e.preventDefault();
      const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g,'').slice(0,6);
      paste.split('').forEach((ch, idx) => { if (boxes[idx]) boxes[idx].value = ch; });
      const next = Math.min(paste.length, boxes.length - 1);
      boxes[next].focus();
    });
  });

  // Countdown
  let seconds = 300;
  const countdownEl = document.getElementById('countdown');
  const resendLink = document.getElementById('resendLink');
  const timer = setInterval(() => {
    seconds--;
    const m = String(Math.floor(seconds/60)).padStart(2,'0');
    const s = String(seconds%60).padStart(2,'0');
    countdownEl.textContent = m + ':' + s;
    if (seconds <= 0) {
      clearInterval(timer);
      countdownEl.textContent = '00:00';
      resendLink.classList.remove('disabled');
    }
  }, 1000);

  resendLink.addEventListener('click', () => {
    if (resendLink.classList.contains('disabled')) return;
    resendLink.classList.add('disabled');
    fetch(`${API_BASE}/service/user/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: storedEmail, service: storedService })
    })
    .catch(() => { errMsg.textContent = 'Không gửi lại được mã, thử lại sau.'; });

    seconds = 300;
  });

  const form = document.getElementById('otpForm');
  const errMsg = document.getElementById('errMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const code = boxes.map(b => b.value).join('');
    if (code.length < 6) {
      errMsg.textContent = 'Vui lòng nhập đủ 6 số.';
      return;
    }
    errMsg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang xác thực...';

    fetch(`${API_BASE}/service/user/verify-reset`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: storedEmail, service: storedService, otp: code })
    })
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      if (ok && data.resetToken) {
        sessionStorage.setItem('reset_token', data.resetToken);
        window.location.href = '/resetpassword/step-3';
      } else {
        errMsg.textContent = data.message || 'Mã OTP không đúng.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Xác nhận';
      }
    })
    .catch(() => {
      errMsg.textContent = 'Có lỗi xảy ra, thử lại sau.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Xác nhận';
    });
  });

  boxes[0].focus();
</script>

</body>
</html>
