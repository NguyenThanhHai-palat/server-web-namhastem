<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu — NamHà Tech Club</title>
<link rel="stylesheet" href="assets/css/login-c.css" />
</head>
<body>

<div class="circuit-bg" aria-hidden="true">
  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#1a8296" stroke-width="1.4" fill="none" opacity="0.4">
      <path d="M0 80 H160 V40 H320"/>
      <path d="M800 420 H700 V380 H560 V440 H420"/>
      <path d="M40 520 H180 V480 H300 V560"/>
    </g>
    <g fill="#1a8296" opacity="0.55">
      <circle cx="160" cy="80" r="4"/><circle cx="320" cy="40" r="4"/>
      <circle cx="700" cy="420" r="4"/><circle cx="420" cy="440" r="4"/>
      <circle cx="180" cy="520" r="4"/><circle cx="300" cy="560" r="4"/>
    </g>
  </svg>
</div>

<div class="card">
  <div class="masthead">
     <img src="https://namha-tech.io.vn/assets/img/kaiadmin/logo_light.svg" alt="NamHà Tech Club" width="100%" style="display:block; border:0;">
  </div>

  <div class="body-area">
    <div class="step-track">
      <div class="step-dot active">1</div><div class="step-line"></div>
      <div class="step-dot pending">2</div><div class="step-line"></div>
      <div class="step-dot pending">3</div>
    </div>

    <h1>Quên mật khẩu?</h1>
    <p class="desc">Nhập email đã đăng ký, chúng tôi sẽ gửi mã OTP gồm 6 số để xác thực.</p>

    <form id="emailForm" novalidate>
      <label for="email">Địa chỉ email</label>
      <input type="email" id="email" name="email" placeholder="ten@vidu.com" autocomplete="email" required>
      <div class="err-msg" id="errMsg"></div>
      <button type="submit" id="submitBtn">Gửi mã OTP</button>
    </form>

    <a class="back-link" href="#">&larr; Quay lại đăng nhập</a>
  </div>
</div>

<script>
  const API_BASE = "https://namha-tech.io.vn"; // đổi nếu domain khác
  const SERVICE_NAME = "webclbnht"; // <-- CHỈNH LẠI cho khớp giá trị "service" dùng khi tạo tài khoản (field u.service trong user.json)

  const form = document.getElementById('emailForm');
  const emailInput = document.getElementById('email');
  const errMsg = document.getElementById('errMsg');
  const submitBtn = document.getElementById('submitBtn');

  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = emailInput.value.trim();

    if(!val){
      errMsg.textContent = 'Vui lòng nhập email.';
      return;
    }
    if(!isValidEmail(val)){
      errMsg.textContent = 'Email không hợp lệ.';
      return;
    }
    errMsg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Đang gửi mã...';

    fetch(`${API_BASE}/service/user/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: val, service: SERVICE_NAME })
    })
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ data }) => {
      // API luôn trả cùng 1 thông báo chung dù email có tồn tại hay không
      // (tránh lộ thông tin tài khoản nào tồn tại), nên cứ chuyển sang bước 2.
      sessionStorage.setItem('reset_email', val);
      sessionStorage.setItem('reset_service', SERVICE_NAME);
      window.location.href = '/resetpassword/step-2';
    })
    .catch(() => {
      errMsg.textContent = 'Có lỗi xảy ra, thử lại sau.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Gửi mã OTP';
    });
  });
</script>

</body>
</html>
