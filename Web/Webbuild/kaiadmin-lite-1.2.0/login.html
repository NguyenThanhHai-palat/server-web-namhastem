<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Nam Ha Tech Club - Đăng nhập</title>
    <meta
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
      name="viewport"
    />
    <link
      rel="icon"
      href="assets/img/kaiadmin/favicon.ico"
      type="image/x-icon"
    />

    <!-- Fonts and icons -->
    <script src="assets/js/plugin/webfont/webfont.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: [
            "Font Awesome 5 Solid",
            "Font Awesome 5 Regular",
            "Font Awesome 5 Brands",
            "simple-line-icons",
          ],
          urls: ["assets/css/fonts.min.css"],
        },
        active: function () {
          sessionStorage.fonts = true;
        },
      });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/plugins.min.css" />
    <link rel="stylesheet" href="assets/css/kaiadmin.min.css" />

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <link rel="stylesheet" href="assets/css/login.css" />

    <style>
      .form-error{
        color:#c0392b; font-size:12.5px; margin:-6px 0 14px; min-height:16px;
      }
      .register-cta{
        text-align:center; margin-top:16px; font-size:13.5px;
      }
      .register-cta a{
        font-weight:700; text-decoration:none;
      }
      .register-cta a:hover{
        text-decoration:underline;
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">

        </div>

        <form id="login-form" class="auth-form active">
          <div class="input-group">
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="l_email" placeholder="  .. Email của bạn" required>
            </div>
          </div>

          <div class="input-group">
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="l_password" placeholder=" ... Mật khẩu" required>
            </div>
          </div>

          <div class="form-error" id="loginErr"></div>

          <div class="form-options">
            <a href="/resetpassword">Quên mật khẩu?</a>
          </div>

          <button type="button" class="btn-auth" id="loginBtn" onclick="login()">Đăng nhập</button>

          <div class="register-cta">
            Chưa có tài khoản? <a href="/thanh-vien-moi">Đăng ký tham gia</a>
          </div>
        </form>
      </div>
    </div>

    <script src="assets/js/core/jquery-3.7.1.min.js"></script>
    <script src="assets/js/core/popper.min.js"></script>
    <script src="assets/js/core/bootstrap.min.js"></script>

    <!-- jQuery Scrollbar -->
    <script src="assets/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js"></script>

    <!-- Chart JS -->
    <script src="assets/js/plugin/chart.js/chart.min.js"></script>

    <!-- jQuery Sparkline -->
    <script src="assets/js/plugin/jquery.sparkline/jquery.sparkline.min.js"></script>

    <!-- Chart Circle -->
    <script src="assets/js/plugin/chart-circle/circles.min.js"></script>

    <!-- Datatables -->
    <script src="assets/js/plugin/datatables/datatables.min.js"></script>

    <!-- Bootstrap Notify -->
    <script src="assets/js/plugin/bootstrap-notify/bootstrap-notify.min.js"></script>

    <!-- jQuery Vector Maps -->
    <script src="assets/js/plugin/jsvectormap/jsvectormap.min.js"></script>
    <script src="assets/js/plugin/jsvectormap/world.js"></script>

    <!-- Sweet Alert -->
    <script src="assets/js/plugin/sweetalert/sweetalert.min.js"></script>

    <!-- Kaiadmin JS -->
    <script src="assets/js/kaiadmin.min.js"></script>

    <!-- Kaiadmin DEMO methods, don't include it in your project! -->
    <script src="assets/js/setting-demo.js"></script>

    <script>
      // ==== Cấu hình API (khớp với các file quên-mật-khẩu) ====
      const API_BASE = "https://namha-tech.io.vn"; // đổi nếu domain khác
      const SERVICE_NAME = "namha-tech-club"; // phải khớp field "service" khi tạo tài khoản

      // ==== ĐĂNG NHẬP -> POST /service/user/login ====
      function login() {
        const emailEl = document.getElementById('l_email');
        const pwEl = document.getElementById('l_password');
        const errEl = document.getElementById('loginErr');
        const btn = document.getElementById('loginBtn');

        const email = emailEl.value.trim();
        const password = pwEl.value;
        errEl.textContent = '';

        if (!email || !password) {
          errEl.textContent = 'Vui lòng nhập đầy đủ email và mật khẩu.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Đang đăng nhập...';

        fetch(`${API_BASE}/service/user/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, service: SERVICE_NAME })
        })
        .then(res => res.json().then(data => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
          if (ok && data.token) {
            localStorage.setItem('namha_token', data.token);
            window.location.href = '/'; // TODO: đổi sang trang đích sau khi đăng nhập
          } else {
            errEl.textContent = data.message || 'Đăng nhập thất bại.';
            btn.disabled = false;
            btn.textContent = 'Đăng nhập';
          }
        })
        .catch(() => {
          errEl.textContent = 'Có lỗi xảy ra, thử lại sau.';
          btn.disabled = false;
          btn.textContent = 'Đăng nhập';
        });
      }
    </script>
  </body>
</html>
